[project]
name = "loan-document-classifier"
version = "0.1.0"
description = "Explainable page classification and document reconstruction for shuffled mortgage packages"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=6.0,<7",
]

[project.optional-dependencies]
ocr = []
ai = ["openai>=1.0,<3"]
ui = ["streamlit>=1.45,<2", "pandas>=2.2,<4"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]
all = [
  "openai>=1.0,<3",
  "streamlit>=1.45,<2",
  "pandas>=2.2,<4",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
loan-doc = "loan_document_classifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loan_document_classifier"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
